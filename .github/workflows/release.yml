name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create signing certificate
        id: sign-cert
        shell: pwsh
        run: |
          $certDir = "certs"
          $pfx = "$certDir\dosbox-uwp.pfx"
          $cer = "$certDir\dosbox-uwp.cer"
          $certPass = "dev"

          if (-not (Test-Path $pfx)) {
            New-Item -ItemType Directory -Path $certDir -Force | Out-Null
            $secPass = ConvertTo-SecureString $certPass -AsPlainText -Force
            $cert = New-SelfSignedCertificate -Subject "CN=DOSBox Pure UWP CI" -FriendlyName "dosbox-uwp" `
              -Type CodeSigningCert -KeyUsage DigitalSignature `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
              -CertStoreLocation Cert:\CurrentUser\My
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secPass -Force | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer -Type CERT -Force | Out-Null
            Write-Host "Cert created: thumbprint=$($cert.Thumbprint)"
            echo "cert_thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          } else {
            # Import existing pfx to get thumbprint
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $certPass)
            Write-Host "Cert exists: thumbprint=$($cert.Thumbprint)"
            echo "cert_thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          }

      - name: Build
        shell: pwsh
        run: |
          $thumb = "${{ steps.sign-cert.outputs.cert_thumbprint }}"
          msbuild "dosbox-pure-unleashed-uwp.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PackageCertificateKeyFile=certs\dosbox-uwp.pfx `
            /p:PackageCertificatePassword=dev `
            /p:PackageCertificateThumbprint=$thumb `
            /nowarn:MSB4011 /m /nologo

      - name: Read actual version
        id: version
        shell: pwsh
        run: |
          # PreBuildEvent (increment-version.ps1) already bumped version.txt + appxmanifest
          $ver = (Get-Content 'version.txt' -Raw).Trim()
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT
          echo "Actual version: $ver"

      - name: Collect release notes
        id: notes
        shell: pwsh
        run: |
          $staticNotes = Join-Path $env:GITHUB_WORKSPACE 'release_notes.md'
          $ver = "${{ steps.version.outputs.version }}"

          if (Test-Path $staticNotes) {
            # Use hand-crafted release notes from repo
            $body = Get-Content $staticNotes -Raw
            Write-Host "Using static release_notes.md"
          } else {
            # Auto-generate from git log
            $prevTag = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+\.\d+$' } | Select-Object -Skip 1 -First 1
            if (-not $prevTag) {
              $prevTag = git rev-list --max-parents=0 HEAD | Select-Object -First 1
              $range = "$prevTag..HEAD"
            } else {
              $range = "$prevTag...HEAD"
            }
            Write-Host "Comparing: $range"

            $commits = git log $range --pretty=format:"%h|%s|%an|%ae" --no-merges
            $authorMap = @{ 'Marcelo Frau' = 'marcelofrau' }
            $sections = [ordered]@{
              features = [System.Collections.ArrayList]@()
              fixes    = [System.Collections.ArrayList]@()
              ui       = [System.Collections.ArrayList]@()
              audio    = [System.Collections.ArrayList]@()
              perf     = [System.Collections.ArrayList]@()
              other    = [System.Collections.ArrayList]@()
            }

            foreach ($line in $commits) {
              if (-not $line) { continue }
              $parts = $line -split '\|', 4
              $hash = $parts[0]; $msg = $parts[1]; $author = $parts[2]
              $ghUser = if ($authorMap.ContainsKey($author)) { $authorMap[$author] } else { $author }
              $entry = "- ``$hash`` $msg -- @$ghUser"
              if ($msg -match '^feat[\(:]')       { [void]$sections.features.Add($entry) }
              elseif ($msg -match '^fix\(audio')   { [void]$sections.audio.Add($entry) }
              elseif ($msg -match '^fix\(ui')      { [void]$sections.ui.Add($entry) }
              elseif ($msg -match '^fix\(')        { [void]$sections.fixes.Add($entry) }
              elseif ($msg -match '^perf[\(:]')    { [void]$sections.perf.Add($entry) }
              else                                 { [void]$sections.other.Add($entry) }
            }

            $lines = [System.Collections.ArrayList]@()
            [void]$lines.Add("## DOSBox Pure UWP $ver")
            [void]$lines.Add("")
            [void]$lines.Add("A DOS emulator for Windows and Xbox, powered by the dosbox-pure libretro core.")
            [void]$lines.Add("")
            [void]$lines.Add("---")
            [void]$lines.Add("")
            [void]$lines.Add("### What's New")

            $sectionLabels = @{
              features = "Features"; fixes = "Bug Fixes"; ui = "UI Improvements"
              audio = "Audio"; perf = "Performance"; other = "Other Changes"
            }
            foreach ($key in $sections.Keys) {
              if ($sections[$key].Count -gt 0) {
                [void]$lines.Add(""); [void]$lines.Add("#### $($sectionLabels[$key])"); [void]$lines.Add("")
                foreach ($entry in $sections[$key]) { [void]$lines.Add($entry) }
              }
            }
            [void]$lines.Add(""); [void]$lines.Add("---"); [void]$lines.Add("")
            [void]$lines.Add("### Installation"); [void]$lines.Add("")
            [void]$lines.Add("1. Download ``dosbox-uwp_${ver}_x64.zip``")
            [void]$lines.Add("2. Extract to a folder")
            [void]$lines.Add("3. Run ``Install.ps1`` (requires PowerShell as Administrator)")
            [void]$lines.Add("4. Launch from Start Menu")
            [void]$lines.Add("")
            [void]$lines.Add("> **Note:** Side-loading requires Developer Mode enabled in Windows Settings.")
            [void]$lines.Add(""); [void]$lines.Add("---"); [void]$lines.Add("")
            [void]$lines.Add("### Links"); [void]$lines.Add("")
            [void]$lines.Add("- [Source Code](https://github.com/marcelofrau/dosbox-pure-uwp/tree/main)")
            [void]$lines.Add("- [DOSBox Pure Core](https://github.com/schellingb/dosbox-pure)")
            [void]$lines.Add("- [Libretro](https://www.libretro.com/)")
            $body = ($lines -join "`n")
          }

          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'release_notes.md'),
            $body,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "Release notes ready"
          Write-Host $body

      - name: Package & Create Distributable
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $platform = "x64"
          $pkgRoot = "AppPackages\dosbox-uwp"

          # Find MSIX — search by glob to handle version mismatch
          $msix = $null
          $pkgDir = $null

          # Try exact match first
          $dirs = @(
            "dosbox-uwp_${ver}_${platform}_Release_Test",
            "dosbox-uwp_${ver}_${platform}_Test",
            "dosbox-uwp_${ver}_${platform}_Release"
          )
          foreach ($d in $dirs) {
            $candidate = Join-Path $pkgRoot $d
            if (Test-Path $candidate) {
              $f = Get-ChildItem $candidate -Filter "*.msix" | Select-Object -First 1
              if ($f) { $msix = $f.FullName; $pkgDir = $candidate; break }
            }
          }

          # Fallback: glob for any dosbox-uwp MSIX package dir
          if (-not $msix) {
            $found = Get-ChildItem $pkgRoot -Directory -Filter "dosbox-uwp_*_x64_*" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($found) {
              $f = Get-ChildItem $found.FullName -Filter "*.msix" | Select-Object -First 1
              if ($f) { $msix = $f.FullName; $pkgDir = $found.FullName }
            }
          }

          # Final fallback
          if (-not $msix) {
            $candidate = "x64\Release\dosbox-uwp\dosbox-uwp.msix"
            if (Test-Path $candidate) { $msix = (Resolve-Path $candidate).Path; $pkgDir = Split-Path $msix }
          }

          if (-not $msix) { Write-Error "MSIX not found"; exit 1 }
          Write-Host "MSIX: $msix"

          # Extract actual version from MSIX filename
          $msixName = Split-Path $msix -Leaf
          if ($msixName -match 'dosbox-uwp_(\d+\.\d+\.\d+\.\d+)_') {
            $actualVer = $Matches[1]
            Write-Host "Actual version from MSIX: $actualVer"
            echo "version=$actualVer" >> $env:GITHUB_OUTPUT
            echo "tag=v$actualVer" >> $env:GITHUB_OUTPUT
            $ver = $actualVer
          }

          # Create distribute folder
          $dist = "distribute"
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # Copy MSIX
          Copy-Item $msix (Join-Path $dist (Split-Path $msix -Leaf))

          # Copy x64 dependencies only
          $depDir = Join-Path $pkgDir 'Dependencies\x64'
          if (Test-Path $depDir) {
            $dest = Join-Path $dist 'Dependencies\x64'
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Get-ChildItem $depDir -Filter "*.appx" | Copy-Item -Destination $dest
          }

          # Copy Install.ps1 (patched with version)
          if (Test-Path 'scripts\install.ps1') {
            $ic = Get-Content 'scripts\install.ps1' -Raw
            $ic = $ic -replace '_1\.0\.0\.0\.', "_${ver}."
            Set-Content (Join-Path $dist 'Install.ps1') $ic -NoNewline
          }

          # Copy cert
          if (Test-Path 'certs\dosbox-uwp.cer') {
            Copy-Item 'certs\dosbox-uwp.cer' (Join-Path $dist 'dosbox-uwp.cer')
          }

          # Create zip
          $zipName = "dosbox-uwp_${ver}_x64.zip"
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zipName -Force
          $zipSize = [math]::Round((Get-Item $zipName).Length / 1MB, 2)
          Write-Host "Zip: $zipName ($zipSize MB)"
          echo "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-uwp-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          compression-level: 0

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DOSBox Pure Unleashed ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.package.outputs.tag }}
          body_path: release_notes.md
          files: ${{ steps.package.outputs.zip }}
          draft: false
          prerelease: false
          make_latest: true
