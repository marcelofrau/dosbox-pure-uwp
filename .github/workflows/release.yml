name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild "dosbox-pure-unleashed-uwp.sln" /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /nowarn:MSB4011 /m /nologo

      - name: Read actual version
        id: version
        shell: pwsh
        run: |
          # PreBuildEvent (increment-version.ps1) already bumped version.txt + appxmanifest
          $ver = (Get-Content 'version.txt' -Raw).Trim()
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT
          echo "Actual version: $ver"

      - name: Collect release notes
        id: notes
        shell: pwsh
        run: |
          # Find the last release tag to diff from
          $prevTag = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+\.\d+$' } | Select-Object -Skip 1 -First 1
          if (-not $prevTag) {
            $prevTag = git rev-list --max-parents=0 HEAD | Select-Object -First 1
            $range = "$prevTag..HEAD"
          } else {
            $range = "$prevTag...HEAD"
          }
          Write-Host "Comparing: $range"

          # Collect commits
          $commits = git log $range --pretty=format:"%h|%s|%an" --no-merges
          $sections = @{
            features = @()
            fixes = @()
            ui = @()
            audio = @()
            perf = @()
            other = @()
          }

          foreach ($line in $commits) {
            if (-not $line) { continue }
            $parts = $line -split '\|', 3
            $hash = $parts[0]
            $msg = $parts[1]
            $author = $parts[2]

            $entry = "- ``$hash`` $msg — @$author"

            if ($msg -match '^feat[\(:]')       { $sections.features += $entry }
            elseif ($msg -match '^fix\(audio')   { $sections.audio += $entry }
            elseif ($msg -match '^fix\(ui')      { $sections.ui += $entry }
            elseif ($msg -match '^fix\(')        { $sections.fixes += $entry }
            elseif ($msg -match '^perf[\(:]')    { $sections.perf += $entry }
            else                                 { $sections.other += $entry }
          }

          # Build markdown body
          $ver = "${{ steps.version.outputs.version }}"
          $body = @"
          ## DOSBox Pure Unleashed $ver

          A DOS emulator for Windows and Xbox, powered by the dosbox-pure libretro core.

          ---

          ### What's New

          "@

          if ($sections.features.Count -gt 0) {
              $body += "`n#### Features`n`n"
              $body += ($sections.features -join "`n") + "`n"
          }
          if ($sections.fixes.Count -gt 0) {
              $body += "`n#### Bug Fixes`n`n"
              $body += ($sections.fixes -join "`n") + "`n"
          }
          if ($sections.ui.Count -gt 0) {
              $body += "`n#### UI Improvements`n`n"
              $body += ($sections.ui -join "`n") + "`n"
          }
          if ($sections.audio.Count -gt 0) {
              $body += "`n#### Audio`n`n"
              $body += ($sections.audio -join "`n") + "`n"
          }
          if ($sections.perf.Count -gt 0) {
              $body += "`n#### Performance`n`n"
              $body += ($sections.perf -join "`n") + "`n"
          }
          if ($sections.other.Count -gt 0) {
              $body += "`n#### Other Changes`n`n"
              $body += ($sections.other -join "`n") + "`n"
          }

          $body += @"

          ---

          ### Installation

          1. Download ``dosbox-uwp_${ver}_x64.zip``
          2. Extract to a folder
          3. Run ``Install.ps1`` (requires PowerShell as Administrator)
          4. Launch from Start Menu

          > **Note:** Side-loading requires Developer Mode enabled in Windows Settings.

          ---

          ### Links

          - [Source Code](https://github.com/marcelofrau/dosbox-pure-uwp/tree/main)
          - [DOSBox Pure Core](https://github.com/schellingb/dosbox-pure)
          - [Libretro](https://www.libretro.com/)
          "@

          # Write to file for release body
          Set-Content -Path 'release_notes.md' -Value $body.Trim() -NoNewline
          Write-Host "Release notes written to release_notes.md"
          Write-Host $body

      - name: Package & Create Distributable
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $platform = "x64"
          $pkgRoot = "AppPackages\dosbox-uwp"

          # Find MSIX — search by glob to handle version mismatch
          $msix = $null
          $pkgDir = $null

          # Try exact match first
          $dirs = @(
            "dosbox-uwp_${ver}_${platform}_Release_Test",
            "dosbox-uwp_${ver}_${platform}_Test",
            "dosbox-uwp_${ver}_${platform}_Release"
          )
          foreach ($d in $dirs) {
            $candidate = Join-Path $pkgRoot $d
            if (Test-Path $candidate) {
              $f = Get-ChildItem $candidate -Filter "*.msix" | Select-Object -First 1
              if ($f) { $msix = $f.FullName; $pkgDir = $candidate; break }
            }
          }

          # Fallback: glob for any dosbox-uwp MSIX package dir
          if (-not $msix) {
            $found = Get-ChildItem $pkgRoot -Directory -Filter "dosbox-uwp_*_x64_*" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($found) {
              $f = Get-ChildItem $found.FullName -Filter "*.msix" | Select-Object -First 1
              if ($f) { $msix = $f.FullName; $pkgDir = $found.FullName }
            }
          }

          # Final fallback
          if (-not $msix) {
            $candidate = "x64\Release\dosbox-uwp\dosbox-uwp.msix"
            if (Test-Path $candidate) { $msix = (Resolve-Path $candidate).Path; $pkgDir = Split-Path $msix }
          }

          if (-not $msix) { Write-Error "MSIX not found"; exit 1 }
          Write-Host "MSIX: $msix"

          # Extract actual version from MSIX filename
          $msixName = Split-Path $msix -Leaf
          if ($msixName -match 'dosbox-uwp_(\d+\.\d+\.\d+\.\d+)_') {
            $actualVer = $Matches[1]
            Write-Host "Actual version from MSIX: $actualVer"
            echo "version=$actualVer" >> $env:GITHUB_OUTPUT
            echo "tag=v$actualVer" >> $env:GITHUB_OUTPUT
            $ver = $actualVer
          }

          # Create distribute folder
          $dist = "distribute"
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # Copy MSIX
          Copy-Item $msix (Join-Path $dist (Split-Path $msix -Leaf))

          # Copy x64 dependencies only
          $depDir = Join-Path $pkgDir 'Dependencies\x64'
          if (Test-Path $depDir) {
            $dest = Join-Path $dist 'Dependencies\x64'
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Get-ChildItem $depDir -Filter "*.appx" | Copy-Item -Destination $dest
          }

          # Copy Install.ps1 (patched with version)
          if (Test-Path 'scripts\install.ps1') {
            $ic = Get-Content 'scripts\install.ps1' -Raw
            $ic = $ic -replace '_1\.0\.0\.0\.', "_${ver}."
            Set-Content (Join-Path $dist 'Install.ps1') $ic -NoNewline
          }

          # Copy cert
          if (Test-Path 'certs\dosbox-uwp.cer') {
            Copy-Item 'certs\dosbox-uwp.cer' (Join-Path $dist 'dosbox-uwp.cer')
          }

          # Create zip
          $zipName = "dosbox-uwp_${ver}_x64.zip"
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zipName -Force
          $zipSize = [math]::Round((Get-Item $zipName).Length / 1MB, 2)
          Write-Host "Zip: $zipName ($zipSize MB)"
          echo "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-uwp-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          compression-level: 0

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DOSBox Pure Unleashed ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.package.outputs.tag }}
          body_path: release_notes.md
          files: ${{ steps.package.outputs.zip }}
          draft: false
          prerelease: false
          make_latest: true
